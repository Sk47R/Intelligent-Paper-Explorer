[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-explorer"
version = "0.1.0"
description = "Intelligent Research Paper Explorer: crawl, embed, search, and summarize academic papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "numpy>=1.26",
    "sentence-transformers>=2.6",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "rich>=13.7",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
paper-explorer = "paper_explorer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_explorer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
]
